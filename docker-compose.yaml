version: "3.9"

services:
  postgres:
    restart: "unless-stopped"
    image: postgres:15-alpine
    stop_grace_period: 1m
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - postgres:/var/lib/postgresql/data
    environment:
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied}
      - POSTGRES_USER=${POSTGRES_USER:?POSTGRES_USER must be supplied}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - 5432:5432/tcp
    healthcheck:
      test: ["CMD", "nc", "-z", "-v", "localhost", "5432"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      default:
        aliases:
          - cosmos-indexer

  indexer:
    restart: "no"
    build:
      dockerfile: Dockerfile
    user: cosmos-indexer
    stop_grace_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
    links:
      - postgres
    networks:
      default:
        aliases:
          - cosmos-indexer
    environment:
      - EXTENDED_ARGS=""
      - LOG_LEVEL="info"
      - DB_USER=${POSTGRES_USER:?POSTGRES_USER must be supplied}
      - DB_PASS=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be supplied}
    tmpfs:
      - /run/cosmos-indexer:mode=1777
    command:
    - /bin/sh
    - -c
    - |
      umask 077
      : "$${DB_USER:?DB_USER is required}" "$${DB_PASS:?DB_PASS is required}"
      case "$$DB_USER$$DB_PASS" in *[!A-Za-z0-9_+=/-]*) exit 64 ;; esac
      config=$$(mktemp /run/cosmos-indexer/database.XXXXXX)
      printf '[database]\nuser = "%s"\npassword = "%s"\n' "$$DB_USER" "$$DB_PASS" > "$$config"
      cosmos-indexer index --config "$$config" \
      --log.pretty=${PRETTY_LOG} \
      --log.level=${LOG_LEVEL} \
      --base.index-transactions=${INDEX_TRANSACTIONS} \
      --base.index-block-events=${INDEX_BLOCK_EVENTS} \
      --base.start-block=${START_BLOCK} \
      --base.end-block=${END_BLOCK} \
      --base.throttling=${THROTTLING} \
      --base.rpc-workers=${RPC_WORKERS} \
      --base.reindex=${REINDEX} \
      --base.reattempt-failed-blocks=false \
      --probe.rpc=${RPC_URL} \
      --probe.account-prefix=${ACCOUNT_PREFIX} \
      --probe.chain-id=${CHAIN_ID} \
      --probe.chain-name=${CHAIN_NAME} \
      --database.host=postgres \
      --database.database=${POSTGRES_DB} \
      ${EXTENDED_ARGS}

volumes:
  postgres:
